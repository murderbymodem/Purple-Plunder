name: Release

# Push a tag like v4.1.0 to build the Windows zip and the Linux AppImage and publish them as a GitHub release.
# Pull requests and manual runs from the Actions tab only build both as workflow artifacts.
on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $file = "PurplePlunder/GlobalAssemblyInfo.cs"
          (Get-Content $file) -replace 'AssemblyFileVersion\(".*?"\)', "AssemblyFileVersion(""$version"")" | Set-Content $file
          Get-Content $file

      - name: Get FFmpeg
        shell: pwsh
        run: ./scripts/get-ffmpeg.ps1

      - name: Publish
        run: >
          dotnet publish PurplePlunder/PurplePlunder/PurplePlunder.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Package
        shell: pwsh
        run: |
          $name = if ("${{ github.ref_type }}" -eq "tag") { "PurplePlunder-${{ github.ref_name }}-win-x64.zip" } else { "PurplePlunder-win-x64.zip" }

          # License texts for Purple Plunder, the bundled libraries and FFmpeg
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path publish/licenses | Out-Null
          Copy-Item LICENSE publish/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.md publish/THIRD-PARTY-NOTICES.md
          Copy-Item licenses/* publish/licenses/
          Copy-Item PurplePlunder/Libraries/ffmpeg-LICENSE.txt, PurplePlunder/Libraries/ffmpeg-README.txt publish/licenses/
          if (-not (Test-Path publish/ffmpeg.exe)) { throw "ffmpeg.exe is missing from the build output" }

          Compress-Archive -Path publish/* -DestinationPath $name
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: PurplePlunder-win-x64
          path: ${{ env.ZIP_NAME }}

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # johnvansickle.com is sometimes unreachable from GitHub's runners: keep the verified download.
      # The key changes with the pinned version/checksum in the script.
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: PurplePlunder/Libraries/linux
          key: ffmpeg-linux-${{ hashFiles('scripts/get-ffmpeg-linux.sh') }}

      - name: Build AppImage
        run: |
          version="$(grep -oP 'AssemblyFileVersion\("\K[^"]+' PurplePlunder/GlobalAssemblyInfo.cs)"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            sed -i "s/AssemblyFileVersion(\".*\")/AssemblyFileVersion(\"$version\")/" PurplePlunder/GlobalAssemblyInfo.cs
          fi
          scripts/build-appimage.sh "$version"
          echo "APPIMAGE=PurplePlunder-$version-x86_64.AppImage" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: PurplePlunder-linux-x86_64
          path: ${{ env.APPIMAGE }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.AppImage
          generate_release_notes: true
